name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build web app and CLI
        run: npm run build
      - name: CLI smoke test on every sample
        run: |
          for f in samples/*.eml; do
            node dist-cli/mailsleuth.js --compact "$f" | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(process.argv[1], a.score, a.level)' "$f"
          done
          node dist-cli/mailsleuth.js - < samples/03-newsletter-legit.eml | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); if (a.level !== "low") process.exit(1)'
      - name: CLI refuses oversized input without reading it all
        run: |
          set +e; head -c 60000000 /dev/zero | node dist-cli/mailsleuth.js -; code=$?; set -e
          test "$code" -eq 2
      - name: CLI escapes bidi controls from the email
        run: printf 'From: a@b.example\nSubject: pay\342\200\256lapyap\n\nhi\n' | node dist-cli/mailsleuth.js --compact - | grep -q 'pay.u202elapyap'
      - name: Built page forbids network access
        run: grep -q "connect-src 'none'" dist/index.html
