name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
        env:
          TZ: Asia/Kolkata # runners default to UTC, which hides dates read as local time
      - name: Timing fuzz (hostile input must stay linear)
        run: npm run fuzz
        env:
          FUZZ_CASES: '3000'
      - name: Build web app and CLI
        run: npm run build
      - name: CLI smoke test on every sample
        run: |
          for f in samples/*.eml; do
            node dist-cli/mailsleuth.js --compact "$f" | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(process.argv[1], a.score, a.level)' "$f"
          done
          node dist-cli/mailsleuth.js - < samples/03-newsletter-legit.eml | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); if (a.level !== "low") process.exit(1)'
          node dist-cli/mailsleuth.js --compact samples/07-outlook-sign-request.msg | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); if (!a.findings.some((f) => f.id === "outlook-msg") || a.level !== "high") process.exit(1)'
      - name: CLI prints a defanged Markdown report
        run: |
          node dist-cli/mailsleuth.js --markdown samples/06-user-report-forwarded.eml > report.md
          grep -q '^# Email report: ' report.md && grep -q '^## Attached email ' report.md && grep -q 'hxxps://xn--pypal-4ve\[\.\]example' report.md
          set +e; node dist-cli/mailsleuth.js --markdown --compact samples/01-paypal-lookalike.eml 2> err.txt; code=$?; set -e
          test "$code" -eq 2 && grep -q 'cannot be combined' err.txt
      - name: CLI reports a damaged .msg instead of crashing
        run: |
          set +e; head -c 3000 samples/07-outlook-sign-request.msg | node dist-cli/mailsleuth.js - 2> err.txt; code=$?; set -e
          test "$code" -eq 2 && grep -q 'damaged' err.txt
      - name: CLI refuses empty input instead of calling it low risk
        run: |
          set +e; printf ' \n\n' | node dist-cli/mailsleuth.js - 2> err.txt; code=$?; set -e
          test "$code" -eq 2 && grep -q 'empty' err.txt
      - name: CLI refuses oversized input without reading it all
        run: |
          set +e; head -c 60000000 /dev/zero | node dist-cli/mailsleuth.js -; code=$?; set -e
          test "$code" -eq 2
      - name: CLI stops quietly when the reader closes the pipe, and reads a file name after --
        run: |
          node dist-cli/mailsleuth.js samples/01-paypal-lookalike.eml 2> err.txt | true; test ! -s err.txt
          node dist-cli/mailsleuth.js --compact -- samples/01-paypal-lookalike.eml | grep -q '"score"'
      - name: CLI escapes bidi controls from the email
        run: |
          printf 'From: a@b.example\nSubject: pay\342\200\256lapyap\n\nhi\n' | node dist-cli/mailsleuth.js --compact - | grep -q 'pay.u202elapyap'
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end journey in Chromium, Firefox and WebKit, served from a sub-path like Pages
        run: npm run e2e -- chromium firefox webkit
      - name: Built page forbids network access
        run: grep -q "connect-src 'none'" dist/index.html
