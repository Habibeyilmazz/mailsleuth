name: Bug report
description: The web app or CLI crashed, froze, showed an error or behaved wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a real email.** If the bug needs an input, build a synthetic one (see CONTRIBUTING.md). Security problems: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, what you saw (error text, screenshot of a synthetic sample) and what you expected.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and version, or CLI with Node version and OS.
      placeholder: Firefox 140 on Windows 11 / CLI, Node 22.18, macOS
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: mailsleuth commit
      description: Output of `git rev-parse --short HEAD`, if you built it yourself.
  - type: textarea
    id: input
    attributes:
      label: Synthetic input that reproduces it (optional)
      render: text
